{% extends "base.html" %}
{% block title %}Nova Conta a Receber{% endblock %}
{% block page_title %}Novo Lançamento — Contas a Receber{% endblock %}

{% block content %}
<div class="card" style="max-width: 650px;">
  <div class="card-body">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Descrição</label>
        <input type="text" name="descricao" class="form-control" required placeholder="Ex: Empréstimo, serviço avulso...">
      </div>
      <div class="mb-3">
        <label class="form-label">Cliente (opcional)</label>
        <select name="cliente_id" class="form-select">
          <option value="">-</option>
          {% for c in clientes %}<option value="{{ c.id }}">{{ c.nome_exibicao }}</option>{% endfor %}
        </select>
      </div>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Valor</label>
          <input type="text" name="valor" class="form-control" required placeholder="0,00">
        </div>
        <div class="col-md-6">
          <label class="form-label">Vencimento</label>
          <input type="date" name="data_vencimento" class="form-control" required>
        </div>
      </div>
      <div class="mb-3 mt-3">
        <label class="form-label">Observações</label>
        <textarea name="observacoes" class="form-control" rows="2"></textarea>
      </div>
      <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Lançar</button>
      <a href="{{ url_for('financeiro.receber') }}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
