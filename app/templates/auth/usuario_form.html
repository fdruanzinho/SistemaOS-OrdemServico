{% extends "base.html" %}
{% block title %}Novo Usuário{% endblock %}
{% block page_title %}Novo Usuário / Técnico{% endblock %}

{% block content %}
<div class="card" style="max-width: 560px;">
  <div class="card-body">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Nome completo</label>
        <input type="text" name="nome" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">E-mail (login)</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Senha</label>
        <input type="password" name="senha" class="form-control" placeholder="Padrão: 123456" >
      </div>
      <div class="mb-3">
        <label class="form-label">Cargo</label>
        <input type="text" name="cargo" class="form-control" placeholder="Ex: Técnico, Vendedor, Gerente">
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="is_admin" id="is_admin">
        <label class="form-check-label" for="is_admin">Usuário administrador (acesso total)</label>
      </div>
      <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Cadastrar</button>
      <a href="{{ url_for('auth.usuarios') }}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
